# ESPHome configuration for this board.
#
# Adapted from yaml/example.yaml in mplinuxgeek/ESPmmWave-LD2450 (MIT). What changed and
# why is in ../README.md; the short version is the LED count, and secrets that upstream
# has hardcoded in a public repository.
#
# The 1085-line ld2450-base.yaml is deliberately NOT vendored here. Upstream's own example
# does not use its local copy either — that line is commented out in favour of the
# `github://` reference below, which is what actually runs. The file belongs to
# EverythingSmartHome's Everything Presence Lite, which declares no licence at all, so
# copying it into this repository would be re-licensing someone else's work by accident.
# ESPHome fetches it at build time.
#
# Pinning `@main` means an upstream change lands on the next build. Pin a tag or a commit
# if you would rather that not happen.

packages:
  ld2450_base: github://everythingsmarthome/everything-presence-lite/common/ld2450-base.yaml@main

esphome:
  name: espmmwave-ld2450
  friendly_name: ESPmmWave-LD2450

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Hotspot"
    password: !secret ap_password

captive_portal:

web_server:
  version: 3
  port: 80

# D1, the single WS2812B on D3 (GPIO4). The board carries exactly one, so num_leds is 1 —
# upstream's example says 60, which is its author's strip rather than this PCB.
#
# The UART is not configured here on purpose: ld2450-base.yaml hardcodes tx_pin GPIO9 and
# rx_pin GPIO8, and on the XIAO ESP32S3 those are D10 and D9 — exactly where this board
# routes RADAR_RX and RADAR_TX. Firmware and copper already agree, so there is nothing to
# override. Changing either end means changing both.
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2811
    pin: GPIO04
    num_leds: 1
    name: "Status LED"
