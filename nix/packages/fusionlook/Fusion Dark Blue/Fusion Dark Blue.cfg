<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!--
  What "apply this theme" writes into user.cfg. PreferencePack::applyConfigChanges
  merges the BaseApp group below into the user's parameters and leaves every other
  key alone, so this file is deliberately short: it names the stylesheet and the
  token file, and sets only those colours that live in preferences rather than in
  the token engine (the 3D view background, the accent, the selection colours).

  Colours are FCUInt packed as 0xRRGGBBAA — the encoding
  nix/packages/freecad-user-cfg.py writes and the one BuiltInParameterSource reads
  back with `color >> 8`. tests/test_theme.py checks each against the hex it claims.
-->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="MainWindow">
          <!-- The stock stylesheet: this theme is tokens, not a fork of FreeCAD.qss. -->
          <FCText Name="StyleSheet">FreeCAD.qss</FCText>
          <FCText Name="QtStyle">FreeCAD</FCText>
          <FCText Name="OverlayActiveStyleSheet">Freecad Overlay.qss</FCText>
          <!-- Names parameters/Fusion Dark Blue.yaml, next to this file. -->
          <FCText Name="Theme">Fusion Dark Blue</FCText>
        </FCParamGroup>
        <FCParamGroup Name="Themes">
          <!-- #0696d7 — ControlActive1 in Fusion's own DarkTheme.xbel, and the same
               accent the token file uses. Only the first slot is written: this theme
               references none of the other two, and overwriting a user's choice to no
               effect is worse than leaving it. -->
          <FCUInt Name="ThemeAccentColor1" Value="110548991"/>
        </FCParamGroup>
        <FCParamGroup Name="View">
          <!-- #4a5568, flat: the chrome lightened a quarter. Fusion's canvas is a
               single lit surface above the chrome, not below it, and a gradient reads
               as a different program. This is the one colour still not measured —
               Fusion's viewport is an Environment, not a theme entry, so it appears
               nowhere in DarkTheme.xbel. It tracks @FusionCanvasColor in the token
               file; change the two together. -->
          <FCBool Name="Simple" Value="1"/>
          <FCBool Name="Gradient" Value="0"/>
          <FCBool Name="RadialGradient" Value="0"/>
          <FCBool Name="UseBackgroundColorMid" Value="0"/>
          <FCUInt Name="BackgroundColor" Value="1247111423"/>
          <!-- #74c0fc and #69db7c: 3.83 and 4.31 WCAG contrast against that canvas.
               FreeCAD's defaults are tuned for a much darker background. Both cleared
               5 against the older, darker canvas; a lighter canvas costs contrast on
               anything light, and these are markers on geometry rather than text. -->
          <FCUInt Name="HighlightColor" Value="1958804735"/>
          <FCUInt Name="SelectionColor" Value="1775992063"/>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
