# Fusion Dark Blue — style parameters for FreeCAD 1.1's token engine.
#
# FreeCAD reads this file because BaseApp/Preferences/MainWindow/Theme names it:
# Gui/Application.cpp resolves the theme to `qss:parameters/<Theme>.yaml`, and the
# pack directory this file sits in is appended to the `qss` search path when the
# PreferencePackManager scans it (Gui/PreferencePackManager.cpp). The tokens below
# are substituted into the stock `FreeCAD.qss` — this theme ships no stylesheet of
# its own, so it follows FreeCAD's own stylesheet as it changes.
#
# Values may be a colour, a length, "@Reference" to another token, or one of three
# functions (Gui/StyleParameters/Parser.cpp):
#
#   lighten(@C, n)   QColor::lighter(100 + n)  — scales HSV value up
#   darken(@C, n)    QColor::darker(100 + n)   — scales HSV value down
#   blend(@A, @B, n) n% of B mixed into A, per RGB channel
#
# Four tokens are NOT defined here and come from user.cfg instead: BackgroundColor
# (Preferences/View) and ThemeAccentColor1..3 (Preferences/Themes).

# =============================================================================
# PALETTE — the only block meant to be edited by hand.
#
# Measured, not eyeballed: every value is read off `DarkTheme.xbel` in Fusion's
# webdeploy install, and each line names the colour it carries there. Two traps in
# that file:
#
#   * its hex is RGBA, not ARGB — `HoverTextColor #FF0000FF` is opaque red, not
#     blue — and 86 of the 233 are translucent;
#   * 37 sit under a heading reading "Since we are only using light theme, set the
#     light theme value here as it for dark theme". Solid `#D1DEEE` is the tell.
#     Do not copy a colour out of that section.
#
# FusionCanvasColor is the one value still unmeasured: Fusion's viewport is an
# Environment, not a theme entry, so no grid or background colour appears in the
# file, the install's XML/JSON, or the user preference tree.
# =============================================================================

PrimaryColor: "#3b4453" # WidgetContainer1/4/9, MBFrameBackground, MBTreeViewBackground — the chrome
FusionStripColor: "#222933" # ActiveContainer3, MBViewSeparator — title strip, document tabs
FusionRaisedColor: "#454f61" # DropDownMenuBackground, MBViewBackground — popups and panels, *lighter*
FusionCanvasColor: "lighten(@PrimaryColor, 25)" # PLACEHOLDER — #4a5568; see the note above
AccentColor: "#0696d7" # ControlActive1, Autodesk's brand blue — the active control
FusionFocusColor: "#38abdf" # FocusOutline1..6, SearchBoxFocusedBorder, WidgetOutline6
FusionBorderColor: "#2e3440" # SearchBoxNormalBorder, MBTreeViewBorderColor, HeaderBorderTop
FusionSelectionColor: "#506d87" # TreeViewDropIndicatorBackground — selected rows
TextForegroundColor: "#d9d9d9" # FontNormal1 — Fusion's body text is not white; FontBold1 is
FusionWashColor: "#d1deee" # not used solid: see below

# Fusion builds its states from one translucent wash rather than from lighter and
# darker surfaces — `#D1DEEE` at 10 % for hover, 20 % pressed, 25 % active — which
# is why the same colours work on the chrome, in a menu and over a tree row alike.
#
# That maps onto the token engine with no approximation: blend(A, B, n) is
# `(1-n)*A + n*B` per channel (Gui/StyleParameters/Parser.cpp:116), which is alpha
# compositing. blend(@PrimaryColor, @FusionWashColor, 10) is #4a5362 against
# HoverContainer1's #4a5463 — one unit of rounding. The arithmetic corroborates
# itself at 50 %, landing on #8691a0 where Fusion declares Triangle2 as #8691A1.

# Muted and disabled are separate roles: FontColorDisabled is #D9D9D9 at 40 %,
# while an inactive label keeps a full FontNormal2. This token goes on *inactive
# tab labels*, which are not disabled — at 40 % they read 2.47:1 on the chrome.
# 70 % is 4.32:1, between FontLight1's 6.12 and that 2.47.
FusionTextMutedColor: "blend(@PrimaryColor, @TextForegroundColor, 70)"
FusionDisabledTextColor: "blend(@PrimaryColor, @TextForegroundColor, 40)" # FontColorDisabled
FusionSeparatorColor: "blend(@PrimaryColor, #ffffff, 20)" # Separator2, #FFFFFF at 20 %

# =============================================================================
# Everything below is derived. Edit only to change the *design*, not the colours.
# =============================================================================

# Steps off PrimaryColor. FreeCAD.qss reaches for these by name, so the ladder has
# to exist even where this theme prefers flat surfaces; the spacing is much tighter
# than FreeCAD Dark's because #3b4453 is a lit surface rather than near-black, and
# a x4 step off it lands in mid-grey instead of a highlight. Most of the rungs are
# now unreferenced — Fusion's states come from the wash, not from this ladder — but
# the two the stock sheet does reach for still resolve.
PrimaryColorDarken1: "darken(@PrimaryColor, 10)"
PrimaryColorDarken2: "darken(@PrimaryColor, 20)"
PrimaryColorDarken3: "darken(@PrimaryColor, 30)"
PrimaryColorDarken4: "darken(@PrimaryColor, 40)"
PrimaryColorDarken5: "darken(@PrimaryColor, 50)"
PrimaryColorDarken6: "darken(@PrimaryColor, 70)"
PrimaryColorLighten1: "lighten(@PrimaryColor, 12)"
PrimaryColorLighten2: "lighten(@PrimaryColor, 22)"
PrimaryColorLighten3: "lighten(@PrimaryColor, 34)"
PrimaryColorLighten4: "lighten(@PrimaryColor, 48)"
PrimaryColorLighten5: "lighten(@PrimaryColor, 90)"
PrimaryColorLighten6: "lighten(@PrimaryColor, 260)"

# Surfaces. Fusion separates planes by *raising* them: the popup #454F61 is
# lighter than the #3B4453 chrome it opens over, not darker. The border is a
# measured colour rather than a darkening of the surface.
GeneralBackgroundColor: "@PrimaryColor"
# MBViewItemBackground and MBViewItemBackgroundOdd are the same #454F61: Fusion's
# lists do not stripe.
GeneralAlternateBackgroundColor: "@PrimaryColor"
GeneralBackgroundHoverColor: "blend(@PrimaryColor, @FusionWashColor, 10)" # HoverContainer1
GeneralBorderColor: "@FusionBorderColor"
GeneralBorderHoverColor: "blend(@PrimaryColor, @FusionWashColor, 50)" # HoverOutline5, at 50 %
GeneralDisabledBackgroundColor: "@PrimaryColorDarken2"
GeneralGridLinesColor: "@FusionSeparatorColor"
GeneralHeaderBackgroundColor: "@FusionStripColor"
DialogBackgroundColor: "@FusionRaisedColor" # MBViewBackground; also the Task Panel
GroupboxBackgroundColor: "@FusionRaisedColor"
GroupboxBorderColor: "@GeneralBorderColor"
ScrollbarBackgroundColor: "@PrimaryColor" # Fusion's track is the surface; the handle is the wash
3DViewBackgroundRefColor: "@FusionCanvasColor"

# One token, two widgets, and Fusion wants a different colour in each: FreeCAD.qss
# paints both `QMenuBar` (line 468) and `QMenu` (line 503) from this, where Fusion
# has the menu *bar* flush with its chrome and the drop-down at the lighter #454F61.
# A theme can only substitute tokens, not add a rule to split them.
#
# The bar wins: with the custom title bar the menu sits *in* the title strip, and a
# #454F61 band across a black title bar is worse than a popup darker than Fusion's.
MenuBackgroundColor: "@FusionStripColor"

# Tabs. The dock-panel tab strip is the same dark band as the document tabs, and
# the selected tab is the panel surface itself, so the tab reads as the front of
# the panel rather than as a button. The document tabs (#mdiAreaTabBar) cannot be
# reached from here — the stock FreeCAD.qss paints them @PrimaryColor and a theme
# cannot add rules, only substitute tokens — so the FusionLook addon styles them
# from FusionStripColor and AccentColor below. See TESTING.md.
TabbarBackgroundColor: "@FusionStripColor"
ActiveTabBackgroundColor: "@PrimaryColor"
InActiveTabBackgroundColor: "@FusionStripColor"

# Buttons are flat: flush with the surface, defined by their border, every state
# carried by the wash. WidgetContainer1 is the button and the panel behind it
# alike, hence a flat pair rather than a gradient.
ButtonTopBackgroundColor: "@PrimaryColor"
ButtonBottomBackgroundColor: "@PrimaryColor"
ButtonBackgroundHooverColor: "@GeneralBackgroundHoverColor" # DropDownButtonHoverBackground
ButtonBorderColor: "@GeneralBorderColor"
ButtonBorderHooverColor: "@GeneralBorderHoverColor"
CheckedButtonTopBackgroundColor: "blend(@PrimaryColor, @FusionWashColor, 20)" # ClickContainer1
CheckedButtonBottomBackgroundColor: "@CheckedButtonTopBackgroundColor"
# ActiveContainer2 / ActiveOutline4: a checked tool button gets the wash and a
# light outline, not the brand blue, which Fusion reserves for the active control.
ToolButtonCheckedBackground: "blend(@PrimaryColor, @FusionWashColor, 20)"
ToolButtonCheckedBorderColor: "blend(@PrimaryColor, @FusionWashColor, 75)" # ActiveOutline4, at 75 %

# The one place Fusion spends the brand blue on a fill. Darkened a step because
# FreeCAD.qss:1180 sets no text colour with it, so the label stays #d9d9d9, and
# that on a flat #0696d7 is 2.9:1 — under AA for body text.
DefaultButtonTopBackgroundColor: "darken(@AccentColor, 20)"
DefaultButtonBottomBackgroundColor: "@DefaultButtonTopBackgroundColor"
DefaultButtonBorderColor: "@AccentColor"

CheckBoxBackgroundColor: "@TextEditFieldBackgroundColor"
CheckBoxBorderColor: "@GeneralBorderHoverColor"
RadioButtonBackgroundColor: "@CheckBoxBackgroundColor"
RadioButtonBorderColor: "@CheckBoxBorderColor"

# Fields are *flush*, not wells: SearchBoxNormalBackground is #3B4453, the chrome
# itself, and the #2E3440 border alone makes it read as a field. Hover and focus go
# lighter (#4E5A6E), not darker. On a dialog — the raised #454F61 — it still sits a
# step down.
TextEditFieldBackgroundColor: "@PrimaryColor"
TextDisabledColor: "@FusionDisabledTextColor"
TextSelectBackgroundColor: "@FusionSelectionColor" # TreeViewDropIndicatorBackground
TextUrlColor: "@FusionFocusColor"

AccentBackgroundColor: "blend(@GeneralBackgroundColor, @AccentColor, 60)"
AccentHoverColor: "blend(@GeneralBackgroundHoverColor, @AccentColor, 30)"

# Sketcher constraint colours: kept from FreeCAD Dark. They are a documented
# language rather than a palette — green is fully constrained everywhere in
# FreeCAD's own manual, so a theme that recolours them is lying to the user.
SketcherConflictingConstraintsColor: "#fc6c6c"
SketcherEmptySketchColor: "#ffffff"
SketcherFullyConstrainedColor: "#8cff5b"
SketcherMalformedConstraintsColor: "#fc6c6c"
SketcherPartiallyRedundantConstraintsColor: "#77cbff"
SketcherRedundantConstraintsColor: "#ffa256"
SketcherSolverFailedColor: "#ff9090"
SketcherUnderConstrainedColor: "#ffffff"

# The icon set FreeCAD.qss pulls arrows and checkmarks out of, and the colour it
# recolours them to on hover. `images_classic` is the light-on-dark set.
IconsLocationFolderName: "images_classic"
StylesheetIconsColor: "white"

InputFieldBorderRadius: "3px"
ToolbarButtonsPadding: "4px"
