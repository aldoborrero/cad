<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Timeline</title>
  <!-- track -->
  <rect x="6" y="30" width="52" height="4" rx="2" fill="#8f9ba8"/>
  <!-- features before the tip -->
  <rect x="8" y="22" width="14" height="20" rx="3" fill="#3a7ca5"/>
  <rect x="25" y="22" width="14" height="20" rx="3" fill="#3a7ca5"/>
  <!-- feature after the tip, rolled back -->
  <rect x="42" y="22" width="14" height="20" rx="3" fill="#3a7ca5" opacity="0.35"/>
  <!-- rollback marker -->
  <rect x="39.5" y="12" width="3" height="40" rx="1.5" fill="#e08a3c"/>
  <rect x="35.5" y="8" width="11" height="8" rx="2" fill="#e08a3c"/>
</svg>
